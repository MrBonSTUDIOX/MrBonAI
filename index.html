
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MrBon AI — MrBon StudioX</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
:root{
 --bg:#d9d9d9;--panel:#f2f2f2;--ink:#111;
 --grey:#6b6b6b;--yellow:#fff700;--bot:#fff;
 color-scheme:light;
}
@media(prefers-color-scheme:dark){
 :root{--bg:#2b2b2b;--panel:#3a3a3a;--ink:#f4f4f4;--grey:#b0b0b0;--bot:#4a4a4a;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
 background:var(--bg);color:var(--ink);
 font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;
 display:flex;flex-direction:column;
 padding-top:env(safe-area-inset-top,0px);
 padding-bottom:env(safe-area-inset-bottom,0px)
}
[hidden]{display:none!important}
button,select{
 font:inherit;font-weight:700;
 background:var(--yellow);color:#000;
 border:2px solid #000;border-radius:12px;
 padding:8px 12px;cursor:pointer
}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid #000;outline-offset:2px}
#login{
 flex:1;display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 gap:14px;padding:24px;text-align:center
}
#login img{width:min(55vw,240px);height:auto}
#login h1{margin:0;font-size:1.7rem}
#login p{margin:0;max-width:34ch;color:var(--grey)}
#gbtn{display:flex;align-items:center;gap:10px;padding:12px 20px;background:#fff;box-shadow:3px 3px 0 #000}
#msgerr{color:#b00020;font-size:.9rem;max-width:36ch}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
header{
 display:flex;align-items:center;gap:9px;
 padding:8px 12px;background:var(--panel);
 border-bottom:3px solid #000
}
header img{width:42px;height:42px;flex:none}
header h1{font-size:1.1rem;margin:0;line-height:1.1}
header small{
 color:var(--grey);display:block;max-width:22ch;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
header .sp{flex:1}
header button{padding:6px 9px;font-size:.8rem}
#provider{
 margin:8px 12px 0;
 width:calc(100% - 24px);
 background:var(--panel);color:var(--ink);
 border:2px solid #000;border-radius:10px;padding:8px
}
#log{
 flex:1;overflow-y:auto;padding:14px;
 display:flex;flex-direction:column;gap:10px
}
.msg{
 max-width:min(85%,640px);padding:10px 14px;
 border:2px solid #000;border-radius:16px;
 white-space:pre-wrap;overflow-wrap:anywhere
}
.me{align-self:flex-end;background:var(--yellow);color:#000;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.err{border-style:dashed;border-color:#b00020}
form{
 display:flex;gap:8px;padding:10px 14px;
 background:var(--panel);border-top:3px solid #000
}
textarea{
 flex:1;resize:none;font:inherit;color:inherit;
 background:var(--bg);border:2px solid #000;
 border-radius:12px;padding:10px;max-height:120px;min-width:0
}
dialog{
 border:3px solid #000;border-radius:16px;
 background:var(--panel);color:var(--ink);
 max-width:420px;width:92%;padding:20px
}
dialog::backdrop{background:#0009}
dialog input,dialog select{
 width:100%;font:inherit;padding:10px;
 border:2px solid #000;border-radius:10px;
 margin:7px 0 12px;background:var(--bg);color:var(--ink)
}
dialog p{margin:6px 0;font-size:.9rem;color:var(--grey)}
.dialog-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.status{font-size:.85rem;color:var(--grey);margin-top:8px}
@media(max-width:520px){
 header{gap:6px;padding:7px}
 header img{width:34px;height:34px}
 header h1{font-size:1rem}
 header button{font-size:.72rem;padding:6px}
 .msg{max-width:92%}
}
</style>
</head>
<body>

<section id="login">
 <img src="./logo.png" alt="MrBon AI">
 <h1>MrBon AI</h1>
 <p>Войди через Google, чтобы общаться с ИИ. Твои чаты сохранятся в аккаунте.</p>
 <button id="gbtn" type="button">
  <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
   <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
   <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.5-4.1 7-10.2 7-17.6z"/>
   <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
   <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
  </svg>
  Войти через Google
 </button>
 <div id="msgerr" role="alert"></div>
</section>

<section id="app" hidden>
 <header>
  <img src="./logo.png" alt="">
  <div><h1>MrBon AI</h1><small id="who"></small></div>
  <span class="sp"></span>
  <button type="button" id="settings">Ключи</button>
  <button type="button" id="clear">Очистить</button>
  <button type="button" id="out">Выйти</button>
 </header>

 <select id="provider" aria-label="Выбор ИИ">
  <option value="gemini">Google Gemini</option>
  <option value="claude">Anthropic Claude</option>
  <option value="openai">OpenAI ChatGPT</option>
 </select>

 <main id="log" aria-live="polite"></main>

 <form id="form">
  <textarea id="input" rows="1" placeholder="Напиши сообщение MrBon AI…" aria-label="Сообщение"></textarea>
  <button id="send" type="submit">Отправить</button>
 </form>
</section>

<dialog id="dlg">
 <h3 style="margin-top:0">Настройки MrBon AI</h3>
 <p>Выбери ИИ, модель и введи соответствующий API-ключ.</p>

 <label for="settingsProvider">Провайдер</label>
 <select id="settingsProvider">
  <option value="gemini">Google Gemini</option>
  <option value="claude">Anthropic Claude</option>
  <option value="openai">OpenAI ChatGPT</option>
 </select>

 <label for="model">Модель</label>
 <select id="model"></select>

 <label for="key">API-ключ</label>
 <input id="key" type="password" placeholder="Вставь API-ключ" autocomplete="off">

 <p>Ключ хранится только в localStorage этого браузера. Он не сохраняется в Firebase.</p>
 <div class="dialog-actions">
  <button type="button" id="save">Сохранить</button>
  <button type="button" id="close">Закрыть</button>
 </div>
 <div id="settingsStatus" class="status"></div>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getAuth,GoogleAuthProvider,signInWithPopup,
 signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
 getFirestore,collection,addDoc,getDocs,query,
 orderBy,serverTimestamp,writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Firebase configuration */
const firebaseConfig={
 apiKey:"AIzaSyDXEBJq9CCSKYffX7XF7hDVHHNLFxxNUN4",
 authDomain:"mrbonaimax.firebaseapp.com",
 projectId:"mrbonaimax",
 storageBucket:"mrbonaimax.firebasestorage.app",
 messagingSenderId:"270950722992",
 appId:"1:270950722992:web:cda5f3900db16173533a75",
 measurementId:"G-C2R9G2D4LJ"
};

/* Cloudflare Worker */
const WORKER_URL="https://mrbonaiapi.mrbonstudiox.workers.dev/api/chat";

const SYSTEM=
"Ты — MrBon AI, дружелюбный искусственный интеллект компании MrBon StudioX. "+
"Отвечай на языке пользователя, понятно и по делу. "+
"Если спросят, кто ты, скажи, что ты MrBon AI от MrBon StudioX.";

const MODELS={
 gemini:[
  {id:"gemini-2.5-flash",name:"Gemini 2.5 Flash"},
  {id:"gemini-2.5-pro",name:"Gemini 2.5 Pro"},
  {id:"gemini-flash-latest",name:"Gemini Flash Latest"}
 ],
 claude:[
  {id:"claude-sonnet-4-5",name:"Claude Sonnet 4.5"},
  {id:"claude-haiku-4-5",name:"Claude Haiku 4.5"},
  {id:"claude-opus-4-1",name:"Claude Opus 4.1"}
 ],
 openai:[
  {id:"gpt-4.1-mini",name:"GPT-4.1 Mini"},
  {id:"gpt-4.1",name:"GPT-4.1"},
  {id:"gpt-4o",name:"GPT-4o"}
 ]
};

const $=id=>document.getElementById(id);
const login=$("login");
const appScreen=$("app");
const log=$("log");
const input=$("input");
const send=$("send");
const dlg=$("dlg");
const provider=$("provider");
const settingsProvider=$("settingsProvider");
const modelSelect=$("model");
const keyInput=$("key");

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let user=null;
let history=[];
let sending=false;

const keyName=p=>"mrbon_key_"+p;

function getKey(p=provider.value){
 try{return localStorage.getItem(keyName(p))||""}
 catch(e){return ""}
}

function setKey(p,value){
 try{localStorage.setItem(keyName(p),value)}
 catch(e){throw new Error("Браузер не разрешил сохранить ключ")}
}

function addMessage(text,role="assistant",isError=false){
 const node=document.createElement("div");
 node.className="msg "+(role==="user"?"me":"bot")+(isError?" err":"");
 node.textContent=text;
 log.appendChild(node);
 log.scrollTop=log.scrollHeight;
 return node;
}

function messagesCollection(){
 if(!user)throw new Error("Пользователь не авторизован");
 return collection(db,"users",user.uid,"messages");
}

async function saveMessage(role,text,usedProvider){
 try{
  await addDoc(messagesCollection(),{
   role,
   text,
   provider:usedProvider||provider.value,
   createdAt:serverTimestamp()
  });
 }catch(e){
  console.error("Firestore save error:",e);
 }
}

function updateModels(selectedProvider,preferred){
 modelSelect.replaceChildren();
 const list=MODELS[selectedProvider]||MODELS.gemini;
 for(const item of list){
  const option=document.createElement("option");
  option.value=item.id;
  option.textContent=item.name;
  modelSelect.appendChild(option);
 }
 if(preferred&&list.some(x=>x.id===preferred)){
  modelSelect.value=preferred;
 }
}

function getModel(){
 return localStorage.getItem("mrbon_model_"+provider.value)||
 MODELS[provider.value][0].id;
}

function openSettings(){
 settingsProvider.value=provider.value;
 updateModels(settingsProvider.value,getModel());
 keyInput.value=getKey(settingsProvider.value);
 $("settingsStatus").textContent="";
 dlg.showModal();
}

settingsProvider.addEventListener("change",()=>{
 const p=settingsProvider.value;
 updateModels(p,localStorage.getItem("mrbon_model_"+p));
 keyInput.value=getKey(p);
});

$("settings").addEventListener("click",openSettings);

$("save").addEventListener("click",()=>{
 const p=settingsProvider.value;
 const k=keyInput.value.trim();
 try{
  setKey(p,k);
  localStorage.setItem("mrbon_model_"+p,modelSelect.value);
  provider.value=p;
  $("settingsStatus").textContent="Настройки сохранены.";
  dlg.close();
 }catch(e){
  $("settingsStatus").textContent=e.message;
 }
});

$("close").addEventListener("click",()=>dlg.close());

provider.addEventListener("change",()=>{
 if(!getKey())openSettings();
});

$("gbtn").addEventListener("click",async()=>{
 $("msgerr").textContent="";
 try{
  await signInWithPopup(auth,new GoogleAuthProvider());
 }catch(e){
  $("msgerr").textContent="Не удалось войти: "+(e.code||e.message);
 }
});

$("out").addEventListener("click",async()=>{
 try{await signOut(auth)}
 catch(e){addMessage("Ошибка выхода: "+e.message,"assistant",true)}
});

async function loadHistory(){
 log.replaceChildren();
 history=[];

 try{
  const snap=await getDocs(query(messagesCollection(),orderBy("createdAt","asc")));
  snap.forEach(doc=>{
   const m=doc.data();
   if(typeof m.text!=="string")return;
   const role=m.role==="user"?"user":"assistant";
   history.push({role,content:m.text});
   addMessage(m.text,role);
  });
 }catch(e){
  console.error(e);
  addMessage("Не удалось загрузить историю: "+e.message,"assistant",true);
 }

 if(!history.length){
  addMessage("Привет, "+(user.displayName||"друг").split(" ")[0]+
   "! Я MrBon AI. О чём поговорим?");
 }
}

onAuthStateChanged(auth,async u=>{
 user=u;
 login.hidden=!!u;
 appScreen.hidden=!u;

 if(!u)return;

 $("who").textContent=u.displayName||u.email||"Аккаунт";
 provider.value=localStorage.getItem("mrbon_provider")||"gemini";

 if(!MODELS[provider.value])provider.value="gemini";

 await loadHistory();

 if(!getKey())openSettings();
});

$("clear").addEventListener("click",async()=>{
 if(!user)return;
 if(!confirm("Удалить всю историю чата?"))return;

 try{
  const snap=await getDocs(messagesCollection());
  const batch=writeBatch(db);
  snap.forEach(doc=>batch.delete(doc.ref));
  await batch.commit();

  history=[];
  log.replaceChildren();
  addMessage("История очищена. О чём поговорим?");
 }catch(e){
  addMessage("Не удалось очистить историю: "+e.message,"assistant",true);
 }
});

input.addEventListener("input",()=>{
 input.style.height="auto";
 input.style.height=Math.min(input.scrollHeight,120)+"px";
});

input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  $("form").requestSubmit();
 }
});

async function sendToAI(message){
 const p=provider.value;
 const apiKey=getKey(p);
 const selectedModel=localStorage.getItem("mrbon_model_"+p)||
 MODELS[p][0].id;

 if(!apiKey){
  openSettings();
  throw new Error("Сначала добавь API-ключ для выбранного ИИ.");
 }

 const token=await user.getIdToken();

 const recentHistory=history.slice(-30);

 const response=await fetch(WORKER_URL,{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "Authorization":"Bearer "+token
  },
  body:JSON.stringify({
   provider:p,
   apiKey:apiKey,
   model:selectedModel,
   message:message,
   system:SYSTEM,
   history:recentHistory
  })
 });

 let data;
 try{data=await response.json()}
 catch(e){throw new Error("Worker вернул неправильный ответ")}

 if(!response.ok){
  const message=
   data.error?.message||
   data.error||
   data.message||
   "Ошибка сервера "+response.status;
  throw new Error(typeof message==="string"?message:JSON.stringify(message));
 }

 if(data.success===false){
  throw new Error(data.error?.message||data.error||"Ошибка ИИ");
 }

 const reply=data.reply||data.text||data.response;

 if(typeof reply!=="string"||!reply.trim()){
  throw new Error("ИИ вернул пустой ответ");
 }

 return reply;
}

$("form").addEventListener("submit",async e=>{
 e.preventDefault();

 if(sending||!user)return;

 const message=input.value.trim();
 if(!message)return;

 if(!getKey()){
  openSettings();
  return;
 }

 sending=true;
 send.disabled=true;

 const activeProvider=provider.value;
 localStorage.setItem("mrbon_provider",activeProvider);

 input.value="";
 input.style.height="auto";

 addMessage(message,"user");
 history.push({role:"user",content:message});
 await saveMessage("user",message,activeProvider);

 const waiting=addMessage("MrBon AI печатает…","assistant");

 try{
  const reply=await sendToAI(message);
  waiting.textContent=reply;

  history.push({role:"assistant",content:reply});
  await saveMessage("assistant",reply,activeProvider);

 }catch(e){
  history.pop();
  waiting.textContent="Не удалось получить ответ: "+e.message;
  waiting.classList.add("err");
 }finally{
  sending=false;
  send.disabled=false;
  input.focus();
  log.scrollTop=log.scrollHeight;
 }
});
</script>
</body>
</html>
