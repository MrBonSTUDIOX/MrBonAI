<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MrBon AI — MrBon StudioX</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#d9d9d9;--panel:#f2f2f2;--ink:#111;--grey:#6b6b6b;--yellow:#fff700;--bot:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#2b2b2b;--panel:#3a3a3a;--ink:#f4f4f4;--grey:#b0b0b0;--bot:#4a4a4a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button{font:inherit;font-weight:700;background:var(--yellow);color:#000;border:2px solid #000;border-radius:12px;padding:8px 14px;cursor:pointer}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid #000;outline-offset:2px}
#login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#login img{width:min(55vw,240px);height:auto}
#login h1{margin:0;font-size:1.7rem}
#login p{margin:0;max-width:34ch;color:var(--grey)}
#gbtn{display:flex;align-items:center;gap:10px;padding:12px 20px;background:#fff;box-shadow:3px 3px 0 #000}
#msgerr{color:#b00020;font-size:.9rem;max-width:36ch}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:3px solid #000}
header img{width:44px;height:44px;flex:none}
header h1{font-size:1.15rem;margin:0;line-height:1.1}
header small{color:var(--grey);display:block;max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .sp{flex:1}
header button{padding:6px 10px;font-size:.85rem}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(85%,640px);padding:10px 14px;border:2px solid #000;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:var(--yellow);color:#000;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.err{border-style:dashed}
form{display:flex;gap:8px;padding:10px 14px;background:var(--panel);border-top:3px solid #000}
textarea{flex:1;resize:none;font:inherit;color:inherit;background:var(--bg);border:2px solid #000;border-radius:12px;padding:10px;max-height:120px}
dialog{border:3px solid #000;border-radius:16px;background:var(--panel);color:var(--ink);max-width:420px;width:92%}
dialog input{width:100%;font:inherit;padding:10px;border:2px solid #000;border-radius:10px;margin:8px 0}
dialog p{margin:6px 0;font-size:.9rem}
</style>
</head>
<body>

<section id="login">
  <img src="logo.png" alt="MrBon AI">
  <h1>MrBon AI</h1>
  <p>Войди через Google, чтобы общаться с ИИ. Твои чаты сохранятся в аккаунте.</p>
  <button id="gbtn" type="button">
    <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.5-4.1 7-10.2 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    Войти через Google
  </button>
  <div id="msgerr" role="alert"></div>
</section>

<section id="app" hidden>
  <header>
    <img src="logo.png" alt="">
    <div><h1>MrBon AI</h1><small id="who"></small></div>
    <span class="sp"></span>
    <button type="button" id="settings">Ключ</button>
    <button type="button" id="clear">Очистить</button>
    <button type="button" id="out">Выйти</button>
  </header>
  <main id="log" aria-live="polite"></main>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Напиши сообщение MrBon AI…" aria-label="Сообщение"></textarea>
    <button id="send" type="submit">Отправить</button>
  </form>
</section>

<dialog id="dlg">
  <strong>Ключ Gemini API</strong>
  <p>Ключ сохраняется только в этом браузере.</p>
  <input id="key" type="password" placeholder="Вставь ключ API" autocomplete="off">
  <button type="button" id="save">Сохранить</button>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,getDocs,query,orderBy,serverTimestamp,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* === ВСТАВЬ СВОЙ FIREBASE CONFIG (Project settings → Your apps → Web app) === */
const firebaseConfig={
  apiKey:"ВСТАВЬ_СЮДА",
  authDomain:"ВАШ-ПРОЕКТ.firebaseapp.com",
  projectId:"ВАШ-ПРОЕКТ",
  storageBucket:"ВАШ-ПРОЕКТ.appspot.com",
  messagingSenderId:"000000000000",
  appId:"ВСТАВЬ_СЮДА"
};
/* ========================================================================== */

const MODEL="gemini-flash-latest";
const API="https://generativelanguage.googleapis.com/v1beta/models/"+MODEL+":generateContent";
const SYSTEM="Ты — MrBon AI, дружелюбный искусственный интеллект компании MrBon StudioX. Отвечай на языке пользователя, понятно и по делу. Если спросят, кто ты, скажи, что ты MrBon AI от MrBon StudioX.";
const $=id=>document.getElementById(id);
const log=$("log"),input=$("input"),send=$("send"),dlg=$("dlg"),errBox=$("msgerr");

const app=initializeApp(firebaseConfig);
const auth=getAuth(app),db=getFirestore(app);
let user=null,history=[];

const col=()=>collection(db,"users",user.uid,"messages");
const getKey=()=>{try{return localStorage.getItem("mrbon_key")||""}catch(e){return ""}};
function add(text,cls){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function saveMsg(role,text){try{await addDoc(col(),{role,text,createdAt:serverTimestamp()})}catch(e){console.error(e)}}

$("gbtn").onclick=async()=>{
  errBox.textContent="";
  try{await signInWithPopup(auth,new GoogleAuthProvider())}
  catch(e){errBox.textContent="Не удалось войти: "+(e.code||e.message)}
};
$("out").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
  user=u;
  $("login").hidden=!!u;$("app").hidden=!u;
  if(!u)return;
  $("who").textContent=u.displayName||u.email;
  log.innerHTML="";history=[];
  try{
    const snap=await getDocs(query(col(),orderBy("createdAt")));
    snap.forEach(d=>{const m=d.data();history.push({role:m.role,parts:[{text:m.text}]});add(m.text,m.role==="user"?"me":"bot")});
  }catch(e){add("Не удалось загрузить историю: "+e.message,"bot err")}
  if(!history.length)add("Привет, "+(u.displayName||"друг").split(" ")[0]+"! Я MrBon AI. О чём поговорим?","bot");
  if(!getKey())dlg.showModal();
});

$("clear").onclick=async()=>{
  if(!confirm("Удалить всю историю чата?"))return;
  try{
    const snap=await getDocs(col());const b=writeBatch(db);
    snap.forEach(d=>b.delete(d.ref));await b.commit();
  }catch(e){}
  history=[];log.innerHTML="";add("История очищена. О чём поговорим?","bot");
};

$("settings").onclick=()=>{$("key").value=getKey();dlg.showModal()};
$("save").onclick=()=>{try{localStorage.setItem("mrbon_key",$("key").value.trim())}catch(e){}dlg.close()};
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=input.scrollHeight+"px"});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}});

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const text=input.value.trim();if(!text)return;
  const key=getKey();
  if(!key){dlg.showModal();return}
  add(text,"me");input.value="";input.style.height="auto";
  history.push({role:"user",parts:[{text}]});
  saveMsg("user",text);
  send.disabled=true;
  const wait=add("MrBon AI печатает…","bot");
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","X-goog-api-key":key},
      body:JSON.stringify({system_instruction:{parts:[{text:SYSTEM}]},contents:history})});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error&&data.error.message||("Ошибка "+r.status));
    const reply=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("")||"(пустой ответ)";
    history.push({role:"model",parts:[{text:reply}]});
    wait.textContent=reply;
    saveMsg("model",reply);
  }catch(err){
    history.pop();
    wait.textContent="Не удалось получить ответ: "+err.message+". Проверь ключ (кнопка «Ключ»).";
    wait.classList.add("err");
  }
  send.disabled=false;log.scrollTop=log.scrollHeight;
});
</script>
</body>
</html>
